<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SketchAR Studio - Single File Version</title>
  <meta name="theme-color" content="#090a16">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090a16; color: #f8fafc; height: 100vh; overflow: hidden; }
    .screen { display: none; width: 100%; height: 100%; position: absolute; inset: 0; flex-direction: column; }
    .screen.active { display: flex; }
    video, #overlay-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #overlay-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
    #overlay-img { position: relative; max-width: 80%; max-height: 80%; object-fit: contain; pointer-events: auto; }
    .hud-top { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 16px; display: flex; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
    .hud-bottom { position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; padding: 16px; display: flex; gap: 8px; justify-content: center; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
    .btn { background: rgba(30, 27, 75, 0.8); border: 1px solid rgba(139, 92, 246, 0.4); color: white; padding: 10px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #7c3aed; border: none; }
    .slider-box { position: absolute; left: 16px; bottom: 100px; z-index: 20; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 12px; }
  </style>
</head>
<body>
  <!-- AR Screen -->
  <div id="ar-screen" class="screen active">
    <video id="camera-stream" autoplay playsinline muted></video>
    <div id="overlay-container">
      <img id="overlay-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' stroke='white' stroke-width='4' fill='none'><circle cx='50' cy='50' r='35'/><circle cx='38' cy='42' r='4' fill='white'/><circle cx='62' cy='42' r='4' fill='white'/><path d='M35 60 Q50 75 65 60'/></svg>" alt="Trace Guide">
    </div>
    <div class="hud-top">
      <button class="btn" onclick="toggleCamera()">Switch Cam</button>
      <button class="btn" onclick="toggleFlash()">Torch</button>
    </div>
    <div class="slider-box">
      <input type="range" min="10" max="100" value="50" oninput="document.getElementById('overlay-img').style.opacity = this.value / 100">
    </div>
    <div class="hud-bottom">
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="loadPhoto(event)">
      <button class="btn" onclick="document.getElementById('file-input').click()">Pick Photo</button>
      <button class="btn" onclick="resetZoom()">Reset</button>
    </div>
  </div>
  <script>
    let stream = null, currentFacing = 'environment';
    async function initCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing } });
        document.getElementById('camera-stream').srcObject = stream;
      } catch (e) { alert('Camera access required: ' + e.message); }
    }
    function toggleCamera() { currentFacing = currentFacing === 'environment' ? 'user' : 'environment'; initCamera(); }
    async function toggleFlash() {
      if (!stream) return;
      const track = stream.getVideoTracks()[0];
      try { await track.applyConstraints({ advanced: [{ torch: true }] }); } catch (e) { alert('Flashlight not supported.'); }
    }
    function loadPhoto(e) {
      const f = e.target.files[0];
      if (f) { const r = new FileReader(); r.onload = ev => document.getElementById('overlay-img').src = ev.target.result; r.readAsDataURL(f); }
    }
    function resetZoom() { document.getElementById('overlay-img').style.transform = 'scale(1)'; }
    initCamera();
  </script>
</body>
</html>
